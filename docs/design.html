<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Sensebook V1 设计</title><style>body{max-width:900px;margin:60px auto;padding:24px;font:17px/1.8 system-ui;background:#f8f7f3;color:#263c34}section{background:white;border:1px solid #deded4;border-radius:18px;padding:24px;margin:24px 0}h1{font-size:36px}b{color:#24634b}</style><h1>从一次查询，到一次理解</h1><p>Sensebook 个人版 · 免登录查询 · 可选同步 · 网站回顾</p><section><b>电脑脚本 / Android</b><p>选中文字 → 本地记录 → 语境解释<br>主动开启同步后 → Cloudflare Workers → D1</p></section><section><b>同一个网站，电脑与手机</b><p>查询历史：原句 / 解释 / 来源 / 设备<br>回顾：每日 / 每周 / 每月 → 用自己的 Key 按需生成<br>设置：设备连接 / 撤销 / 本机模型配置</p></section><section><b>数据边界</b><p>原始查询是事实；AI 回顾是可重建的内容。删除查询后，相关回顾清理。Key 不存入 D1。</p></section></html>
